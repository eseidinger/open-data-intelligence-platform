services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: odip
      POSTGRES_USER: odip
      POSTGRES_PASSWORD: odip
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odip -d odip"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
