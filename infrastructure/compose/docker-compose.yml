services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: odip
      POSTGRES_USER: odip
      POSTGRES_PASSWORD: odip
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odip -d odip"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: odip
      MINIO_ROOT_PASSWORD: odip-local-development
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
