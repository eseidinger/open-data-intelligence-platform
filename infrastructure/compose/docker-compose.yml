services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: odip
      POSTGRES_USER: odip
      POSTGRES_PASSWORD: odip
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odip -d odip"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-store:
    # SeaweedFS provides a license-free, S3-compatible object store for local development.
    image: chrislusf/seaweedfs:latest
    environment:
      AWS_ACCESS_KEY_ID: odip
      AWS_SECRET_ACCESS_KEY: odip-local-development
      S3_BUCKET: odip-raw
    ports:
      - "9000:8333"
    volumes:
      - object-store-data:/data

volumes:
  postgres-data:
  object-store-data:
