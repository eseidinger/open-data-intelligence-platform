# Installation bootstrap for the two ODIP telemetry components. The platform
# provisioner can reconcile only these named objects in project-odip.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-web
  namespace: project-odip
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-ingestion-worker
  namespace: project-odip
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-reader
  namespace: project-odip
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: [web]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-reader
  namespace: project-odip
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metrics-reader
subjects:
  - kind: ServiceAccount
    name: workload-metrics-reader
    namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odip-telemetry-provisioner
  namespace: project-odip
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [telemetry-web, telemetry-ingestion-worker]
    verbs: [get, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    resourceNames: [metrics-reader]
    verbs: [get, patch, delete]
  # Kubernetes requires a Role's author to hold every permission it grants.
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: [web]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odip-telemetry-provisioner
  namespace: project-odip
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odip-telemetry-provisioner
subjects:
  - kind: ServiceAccount
    name: provisioner
    namespace: platform-system
