[project]
name = "energy-system-contract-kit"
version = "1.0.0"
description = "Executable contracts and fixtures for energy-system configuration"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
    "rfc8785==0.1.4",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
