openapi: 3.1.0
info:
  title: ODIP immutable dataset publication API
  version: 1.0.0
  description: Domain-neutral discovery and retrieval of published dataset versions.
servers:
  - url: https://api-odip.apps.example.invalid
security:
  - platformBearer: []
paths:
  /api/v1/datasets:
    get:
      operationId: listPublishedDatasets
      parameters:
        - name: status
          in: query
          schema: {type: string, const: PUBLISHED}
        - name: schemaRef
          in: query
          schema: {type: string, format: uri}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of immutable publication manifests.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/AccessUnavailable'}
  /api/v1/datasets/{datasetId}/versions/{version}:
    get:
      operationId: getDatasetPublication
      parameters:
        - $ref: '#/components/parameters/DatasetId'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The immutable publication manifest.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: ../schemas/dataset-publication-v1.schema.json}
        '304':
          description: The supplied ETag still identifies the immutable version.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/AccessUnavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/datasets/{datasetId}/versions/{version}/artifacts/{artifactId}:
    get:
      operationId: getDatasetArtifact
      parameters:
        - $ref: '#/components/parameters/DatasetId'
        - $ref: '#/components/parameters/Version'
        - name: artifactId
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9-]{1,99}$'}
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Immutable artifact bytes in the media type declared by the manifest.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {}
            application/octet-stream:
              schema: {type: string, contentEncoding: binary}
        '304':
          description: The supplied ETag still identifies the immutable artifact.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/AccessUnavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    platformBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived client-credentials token from the platform-managed service
        binding. The platform validates its derived audience and approved group
        IDs, strips the token, and forwards normalized identity headers to ODIP.
        Application-defined OAuth scopes are not used.
  parameters:
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9-]{2,99}$'}
    Version:
      name: version
      in: path
      required: true
      schema:
        type: string
        pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: {type: string}
  headers:
    ETag:
      description: Quoted lowercase SHA-256 digest of the returned representation.
      schema: {type: string, pattern: '^"[0-9a-f]{64}"$'}
  schemas:
    PublicationPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: {$ref: ../schemas/dataset-publication-v1.schema.json}
        page: {type: integer, minimum: 0}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    Error:
      $ref: ../schemas/error-v1.schema.json
  responses:
    BadRequest:
      description: Malformed or ambiguous route path rejected by the platform boundary.
      content:
        application/json:
          schema: {$ref: ../schemas/platform-access-error-v1.schema.json}
    Unauthorized:
      description: Missing, invalid, or expired identity; bearer routes never redirect.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: ../schemas/platform-access-error-v1.schema.json
    Forbidden:
      description: Platform route-group denial or ODIP dataset-level denial.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: ../schemas/platform-access-error-v1.schema.json
    NotFound:
      description: Dataset, published version, or artifact was not found.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Dataset version exists but is not published.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AccessUnavailable:
      description: Platform authentication or authorization snapshot unavailable; fail closed before the backend.
      content:
        application/json:
          schema: {$ref: ../schemas/platform-access-error-v1.schema.json}
