name: Deploy to Developer Platform

on:
  workflow_run:
    workflows:
      - Build and publish Docker images
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install developer-platform-cli
      - name: Create deployment declaration
        run: >-
          python3 scripts/render-integration.py --image-tag "$IMAGE_TAG"
          > "$RUNNER_TEMP/application.json"
      - name: Deploy and wait for readiness
        run: |
          devplat deploy apply --project odip \
            --file "$RUNNER_TEMP/application.json" --output json > "$RUNNER_TEMP/accepted.json"
          operation_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["operation_id"])' "$RUNNER_TEMP/accepted.json")
          if ! devplat operations watch "$operation_id" --output json; then
            for attempt in {1..60}; do
              devplat operations get "$operation_id" --output json > "$RUNNER_TEMP/operation.json"
              state=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["state"])' "$RUNNER_TEMP/operation.json")
              if [ "$state" = succeeded ]; then
                cat "$RUNNER_TEMP/operation.json"
                exit 0
              fi
              if [ "$state" = failed ]; then
                cat "$RUNNER_TEMP/operation.json"
                exit 1
              fi
              sleep 5
            done
            cat "$RUNNER_TEMP/operation.json"
            exit 1
          fi
        env:
          PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
          PLATFORM_TOKEN_ENDPOINT: ${{ vars.PLATFORM_TOKEN_ENDPOINT }}
          PLATFORM_CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
          PLATFORM_CLIENT_SECRET: ${{ secrets.PLATFORM_CLIENT_SECRET }}
