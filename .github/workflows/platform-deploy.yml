name: Deploy to Developer Platform

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      descriptor:
        required: true
        type: string
      environment:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PROJECT: ${{ inputs.project }}
      DESCRIPTOR: ${{ inputs.descriptor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/upgrade-devplat.sh python3
      - name: Check deployment descriptor
        run: |
          case "$PROJECT:$DESCRIPTOR:$GITHUB_REF" in
            odip-test:infrastructure/deployments/application-test.json:refs/heads/main) expected_version=latest ;;
            odip:infrastructure/deployments/application.json:refs/tags/v*)
              expected_version="${GITHUB_REF#refs/tags/v}"
              python3 scripts/render-release.py --version "$expected_version" --file "$DESCRIPTOR" \
                > "$RUNNER_TEMP/application-release.json"
              DESCRIPTOR="$RUNNER_TEMP/application-release.json"
              echo "DESCRIPTOR=$DESCRIPTOR" >> "$GITHUB_ENV"
              ;;
            *) echo 'Deployment target does not match the Git ref'; exit 1 ;;
          esac
          jq -e --arg project "$PROJECT" --arg version "$expected_version" '
            .metadata.name == $project and .metadata.project == $project and
            (.spec.components | all(.runtime.image | endswith(":" + $version))) and
            (.spec.components[] | select(.name == "web") | .bindings |
              length == 1 and .[0].envPrefix == "" and
              (.[0].bindingId | test("^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$"))) and
            (.spec.configuration.values.ODIP_WORKER_BINDING_PREFIX |
              test("^ACCESS_[A-Z0-9_]+$"))
          ' "$DESCRIPTOR" > /dev/null
      - name: Deploy and wait for readiness
        run: |
          devplat deploy apply --project "$PROJECT" \
            --file "$DESCRIPTOR" --output json > "$RUNNER_TEMP/accepted.json"
          operation_id=$(jq -r '.operation_id' "$RUNNER_TEMP/accepted.json")
          if ! devplat operations watch "$operation_id" --output json; then
            for attempt in {1..60}; do
              devplat operations get "$operation_id" --output json > "$RUNNER_TEMP/operation.json"
              state=$(jq -r '.state' "$RUNNER_TEMP/operation.json")
              if [ "$state" = succeeded ]; then
                cat "$RUNNER_TEMP/operation.json"
                exit 0
              fi
              if [ "$state" = failed ]; then
                cat "$RUNNER_TEMP/operation.json"
                exit 1
              fi
              sleep 5
            done
            cat "$RUNNER_TEMP/operation.json"
            exit 1
          fi
        env:
          PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
          PLATFORM_TOKEN_ENDPOINT: ${{ vars.PLATFORM_TOKEN_ENDPOINT }}
          PLATFORM_CLIENT_ID: ${{ secrets[inputs.project == 'odip-test' && 'PLATFORM_CLIENT_ID_TEST' || 'PLATFORM_CLIENT_ID'] }}
          PLATFORM_CLIENT_SECRET: ${{ secrets[inputs.project == 'odip-test' && 'PLATFORM_CLIENT_SECRET_TEST' || 'PLATFORM_CLIENT_SECRET'] }}
