name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'services/**'
      - 'workers/**'
      - 'web/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'infrastructure/**'
      - '.github/workflows/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-and-deploy
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish Docker Hub images
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release descriptor and version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/render-release.py --version "$RELEASE_TAG" > /dev/null
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: eseidinger
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: platform-meta
        uses: docker/metadata-action@v5
        with:
          flavor: latest=false
          images: docker.io/eseidinger/odip-platform
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: platform
          push: true
          tags: ${{ steps.platform-meta.outputs.tags }}
          labels: ${{ steps.platform-meta.outputs.labels }}
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform

      - id: worker-meta
        uses: docker/metadata-action@v5
        with:
          flavor: latest=false
          images: docker.io/eseidinger/odip-data-worker
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/data-worker/Dockerfile
          push: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
          cache-from: type=gha,scope=data-worker
          cache-to: type=gha,mode=max,scope=data-worker

  deploy-test:
    needs: publish
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/platform-deploy.yml
    with:
      project: odip-test
      descriptor: infrastructure/deployments/application-test.json
      environment: test
    secrets: inherit

  deploy-production:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/platform-deploy.yml
    with:
      project: odip
      descriptor: infrastructure/deployments/application.json
      environment: production
    secrets: inherit
