name: Verify

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  platform-api:
    name: Platform API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform-api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: odip
          POSTGRES_USER: odip
          POSTGRES_PASSWORD: odip
        options: >-
          --health-cmd "pg_isready -U odip -d odip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ODIP_DATABASE_URL: jdbc:postgresql://localhost:5432/odip
      ODIP_DATABASE_USERNAME: odip
      ODIP_DATABASE_PASSWORD: odip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew --no-daemon test

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  data-worker:
    name: Data worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/data-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/data-worker/uv.lock
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
