name: Verify

on:
  pull_request:
    paths:
      - 'services/**'
      - 'workers/**'
      - 'web/**'
      - 'scripts/**'
      - 'contracts/**'
      - 'ruff.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  platform-api:
    name: Platform API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform-api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: odip
          POSTGRES_USER: odip
          POSTGRES_PASSWORD: odip
        options: >-
          --health-cmd "pg_isready -U odip -d odip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
      rustfs:
        image: rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
        env:
          RUSTFS_ACCESS_KEY: odip-local-access
          RUSTFS_SECRET_KEY: odip-local-secret-only
          RUSTFS_VOLUMES: /data
          RUSTFS_OBS_LOGGER_LEVEL: error
        options: >-
          --health-cmd "wget -q --spider http://127.0.0.1:9000/health/ready"
          --health-interval 5s
          --health-timeout 3s
          --health-start-period 30s
          --health-retries 20
        ports:
          - 9000:9000
    env:
      ODIP_S3_INTEGRATION_TEST: "true"
      AWS_ENDPOINT_URL_S3: http://localhost:9000
      AWS_ACCESS_KEY_ID: odip-local-access
      AWS_SECRET_ACCESS_KEY: odip-local-secret-only
      AWS_DEFAULT_REGION: us-east-1
      ODIP_DATABASE_URL: jdbc:postgresql://localhost:5432/odip
      ODIP_DATABASE_USERNAME: odip
      ODIP_DATABASE_PASSWORD: odip
    steps:
      - uses: actions/checkout@v4
      - run: python3 ../../scripts/verify-contract-kit.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew --no-daemon ktlintCheck test bootJar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project ../../workers/data-worker --locked python ../../scripts/local-publication-acceptance.py

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - run: npm audit --audit-level=high

  data-worker:
    name: Data worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/data-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/data-worker/uv.lock
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests ../../scripts
      - run: uv run python -m unittest discover -s tests
      - run: python ../../scripts/verify-contract-kit.py
      - run: uv run --frozen pytest
        working-directory: contracts/vendor/contract-kit-v0.5.0/contract-kit
