[project]
name = "odip-data-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["requests>=2.32", "jsonschema==4.26.0", "rfc8785==0.1.4", "urllib3>=2.6.3", "opentelemetry-sdk>=1.38,<2", "opentelemetry-exporter-otlp-proto-http>=1.38,<2"]

[project.scripts]
odip-ingest = "odip_worker.run:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
odip_worker = ["adapters.json"]

[dependency-groups]
dev = ["ruff==0.14.2"]
