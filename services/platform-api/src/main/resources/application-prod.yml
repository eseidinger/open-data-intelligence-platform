spring:
  datasource:
    url: ${ODIP_DATABASE_URL}
    username: ${ODIP_DATABASE_USERNAME}
    password: ${ODIP_DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
          immutable: true

server:
  forward-headers-strategy: framework
