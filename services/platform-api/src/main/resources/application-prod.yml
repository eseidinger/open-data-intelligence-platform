spring:
  datasource:
    url: ${ODIP_DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:odip}}
    username: ${ODIP_DATABASE_USERNAME:${PGUSER:odip}}
    password: ${ODIP_DATABASE_PASSWORD:${PGPASSWORD:odip}}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
          immutable: true

server:
  forward-headers-strategy: framework
