spring:
  application:
    name: platform-api
  profiles:
    default: dev
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

odip:
  raw-artifact:
    max-payload-bytes: ${ODIP_RAW_ARTIFACT_MAX_PAYLOAD_BYTES:10485760}
