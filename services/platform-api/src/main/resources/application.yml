spring:
  application:
    name: platform-api
  profiles:
    default: dev
  jpa:
    open-in-view: false

management:
  tracing:
    export:
      enabled: false
    propagation:
      type: w3c
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

odip:
  source-policy:
    hosts: ${ODIP_SOURCE_HOSTS:jsonplaceholder.typicode.com,ec.europa.eu,re.jrc.ec.europa.eu}
  raw-artifact:
    max-payload-bytes: ${ODIP_RAW_ARTIFACT_MAX_PAYLOAD_BYTES:10485760}
