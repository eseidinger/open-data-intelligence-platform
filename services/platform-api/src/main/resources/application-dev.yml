spring:
  datasource:
    url: ${ODIP_DATABASE_URL:jdbc:postgresql://localhost:5432/odip}
    username: ${ODIP_DATABASE_USERNAME:odip}
    password: ${ODIP_DATABASE_PASSWORD:odip}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoint:
    health:
      show-details: always
